meta:
  name:    
    full: The Strategy Unit
  link:
    home: https://www.strategyunitwm.nhs.uk/
    github: https://github.com/The-Strategy-Unit    

# adjust these paths if logos are placed elsewhere
logo:
  small:
    light: images/logo_black_medium.png
    dark: images/logo_yellow_medium.png
  medium:
    light: images/logo_black_medium.png
    dark: images/logo_yellow_medium.png
  large: 
    light: images/logo_black.svg 
    dark: images/logo_yellow.svg  

color:
  palette:    
    dark-grey: "#959595"    
    su-charcoal: "#2c2825"
    su-yellow: "#f9bd07"    
    su-white: "#f5f4f3"
    su-blue: "#5881c1"    
  # Explicit light and dark semantic colours allow Quarto to generate the
  # colour-scheme toggle and keep components in sync when the mode changes.
  foreground:
    light: su-charcoal
    dark: su-white
  background:
    light: su-white
    dark: su-charcoal
  primary:
    light: su-yellow
    dark: su-yellow
  secondary:
    light: dark-grey
    dark: su-white
  info:
    light: su-blue
    dark: su-yellow

typography:
  fonts:
    - family: "Roboto Slab"
      weight: [300, 700]
      source: google
    - family: "Open Sans"
      weight: [400, 600, 700]
      source: google

  base:
    family: "Open Sans"
    weight: 400

  headings:
    family: "Roboto Slab"
    weight: 700

  link:
    color: info

